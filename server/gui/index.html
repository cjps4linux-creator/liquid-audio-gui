<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Liquid Audio GUI</title>
<style>
  :root {
    bg: #0b0c10;
    panel: #11131a;
    accent: #7c5cff;
    accent2: #45b6ff;
    text: #e6e8ee;
    muted: #8a8f9c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(1200px 800px at 10% -10%, #1a1d2e 0%, #0b0c10 45%) no-repeat fixed;
    color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
  }
  .wrap {
    max-width: 960px; margin: 0 auto; padding: 24px;
    display: grid; gap: 16px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  .badge {
    font-size: 12px; padding: 4px 8px; border-radius: 999px;
    background: #1f2330; color: var(--muted); border: 1px solid #2a2f3d;
  }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.00));
    border: 1px solid #2a2f3d; border-radius: 16px; padding: 18px;
  }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .orb {
    width: 110px; height: 110px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent), var(--accent2), var(--accent));
    filter: blur(0.5px);
    box-shadow: 0 0 0 0 rgba(124,92,255,0.0);
    transition: transform .25s ease, box-shadow .4s ease;
  }
  .orb.listening {
    animation: pulse 1.6s infinite;
    box-shadow: 0 0 40px 10px rgba(124,92,255,0.35);
  }
  .orb.speaking {
    animation: pulse 1.1s infinite;
    box-shadow: 0 0 50px 14px rgba(69,182,255,0.35);
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  .controls { display: flex; gap: 10px; }
  button {
    appearance: none; border: 1px solid #2a2f3d; color: var(--text);
    background: #151825; padding: 10px 14px; border-radius: 12px; cursor: pointer;
    font-weight: 500;
  }
  button.primary { background: linear-gradient(180deg,#7c5cff,#5b3df0); border-color: transparent; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { color: var(--muted); font-size: 12px; }
  .status.ok { color: #7ee787; }
  .status.err { color: #ff8a8a; }
  .transcript-box {
    display: block; min-height: 80px; max-height: 220px; overflow: auto;
    background: #0d0f16; border: 1px solid #232837; border-radius: 12px;
    padding: 12px; white-space: pre-wrap;
  }
  .log-box {
    display: block; min-height: 80px; max-height: 220px; overflow: auto;
    background: #0d0f16; border: 1px solid #232837; border-radius: 12px;
    padding: 12px; white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
    font-size: 12px; color:#c9ccd6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎙️ Liquid Audio GUI</h1>
    <div class="row">
      <div id="wsStatus" class="badge">WebSocket: disconnected</div>
      <div id="modelStatus" class="badge">LM Studio: checking…</div>
    </div>
  </header>

  <section class="card">
    <div class="row">
      <div id="orb" class="orb"></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="controls">
          <button id="btnConnect" class="primary">Connect</button>
          <button id="btnMic" disabled>Start mic</button>
          <button id="btnCommit" disabled>Send</button>
        </div>
        <div id="status" class="status">Idle</div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <strong>Transcript</strong>
      <button id="btnClear">Clear</button>
    </div>
    <div id="transcript" class="transcript-box">Waiting…</div>
  </section>

  <section class="card">
    <strong>Logs</strong>
    <div id="logs" class="log-box" style="margin-top:8px;"></div>
  </section>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const WS = wsProto + '//' + window.location.hostname + ':8765/ws/voice';

  const orb = $('orb'), status = $('status'), logs = $('logs'), transcript = $('transcript');
  const wsStatus = $('wsStatus'), modelStatus = $('modelStatus');
  const btnConnect = $('btnConnect'), btnMic = $('btnMic'), btnCommit = $('btnCommit'), btnClear = $('btnClear');

  let ws = null;
  let mediaStream = null;
  let audioContext = null;
  let scriptProcessor = null;
  let started = false;

  function logMsg(msg, kind) {
    kind = kind || 'info';
    const timeStr = new Date().toLocaleTimeString();
    const line = document.createElement('div');
    line.textContent = '[' + timeStr + '] [' + kind + '] ' + msg;
    line.style.color = kind === 'error' ? '#ff8a8a' : kind === 'ok' ? '#7ee787' : '#c9ccd6';
    logs.appendChild(line);
    logs.scrollTop = logs.scrollHeight;
  }

  function setStatus(msg, ok) {
    status.textContent = msg;
    status.className = 'status' + (ok === true ? ' ok' : ok === false ? ' err' : '');
  }

  function setOrb(cls) {
    orb.className = 'orb' + (cls ? ' ' + cls : '');
  }

  async function checkLM() {
    try {
      const r = await fetch('http://127.0.0.1:1234/v1/models');
      if (!r.ok) throw new Error('not ok');
      const j = await r.json();
      const ids = (j.data || []).map(function(x) { return x.id; }).join(', ');
      modelStatus.textContent = 'LM Studio: ' + ids.slice(0, 80);
      modelStatus.classList.add('ok');
    } catch (e) {
      modelStatus.textContent = 'LM Studio: unreachable';
      modelStatus.classList.add('err');
    }
  }
  checkLM();

  function connect() {
    if (ws) return;
    ws = new WebSocket(WS);
    ws.binaryType = 'arraybuffer';
    ws.onopen = function() {
      wsStatus.textContent = 'WebSocket: connected';
      wsStatus.classList.add('ok');
      setStatus('Connected');
      btnConnect.disabled = true;
      btnMic.disabled = false;
      sendJson({type: 'session.update'});
    };
    ws.onclose = function() {
      wsStatus.textContent = 'WebSocket: disconnected';
      wsStatus.classList.remove('ok');
      setStatus('Disconnected');
      btnConnect.disabled = false;
      btnMic.disabled = true;
      btnCommit.disabled = true;
      started = false;
      setOrb('');
      ws = null;
    };
    ws.onerror = function() {
      logMsg('WebSocket error', 'error');
    };
    ws.onmessage = async function(ev) {
      let msg;
      if (typeof ev.data === 'string') {
        msg = JSON.parse(ev.data);
      } else {
        return;
      }
      const extra = msg.transcript ? ' | ' + msg.transcript.slice(0, 200) : '';
      logMsg('event: ' + msg.type + extra);
      if (msg.type === 'session.created' || msg.type === 'session.updated') return;
      if (msg.type === 'conversation.item.input_audio_transcription.completed') {
        if (msg.transcript) {
          transcript.textContent += '\nYou: ' + msg.transcript;
          transcript.scrollTop = transcript.scrollHeight;
        }
        return;
      }
      if (msg.type === 'response.audio.delta') {
        setOrb('speaking');
        if (msg.delta) {
          const binary = new Uint8Array(atob(msg.delta).split('').map(function(ch) { return ch.charCodeAt(0); }));
          const wav = encodeWAV(binary);
          const blob = new Blob([wav], { type: 'audio/wav' });
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          const prev = started;
          audio.onended = function() {
            setOrb(prev ? 'listening' : '');
            URL.revokeObjectURL(url);
          };
          audio.play().catch(function(e) { logMsg('Audio play failed: ' + e.message, 'error'); });
        }
        if (msg.transcript) {
          transcript.textContent += '\nAssistant: ' + msg.transcript;
          transcript.scrollTop = transcript.scrollHeight;
        }
        return;
      }
      if (msg.type === 'response.done') {
        setOrb(started ? 'listening' : '');
        return;
      }
      if (msg.type === 'error') {
        logMsg('Server error: ' + (msg.error || ''), 'error');
        setStatus('Error', false);
        return;
      }
    };
  }

  function sendJson(obj) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify(obj));
  }

  btnConnect.onclick = connect;

  async function startMic() {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      logMsg('Connect first', 'error');
      return;
    }
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true }
      });
    } catch (e) {
      logMsg('Mic error: ' + e.message, 'error');
      return;
    }
    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const source = audioContext.createMediaStreamSource(mediaStream);
    scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
    source.connect(scriptProcessor);
    scriptProcessor.connect(audioContext.destination);
    started = true;
    btnMic.disabled = true;
    btnCommit.disabled = false;
    setOrb('listening');
    logMsg('Mic started');
    scriptProcessor.onaudioprocess = function(e) {
      if (!started || !ws || ws.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);
      const pcm = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        let s = Math.max(-1, Math.min(1, input[i]));
        pcm[i] = s < 0 ? s * 32768 : s * 32767;
      }
      let binary = '';
      for (let i = 0; i < pcm.length; i++) {
        binary += String.fromCharCode(pcm[i]);
      }
      const b64 = btoa(binary);
      sendJson({ type: 'input_audio_buffer.append', audio: b64 });
    };
  }

  btnMic.onclick = startMic;

  btnCommit.onclick = function() {
    sendJson({ type: 'input_audio_buffer.commit' });
    logMsg('Utterance committed');
  };

  btnClear.onclick = function() {
    transcript.textContent = 'Waiting…';
    logs.innerHTML = '';
  };

  function encodeWAV(samples) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buf);
    function writeString(offset, str) {
      for (let i = 0; i < str.length; i++) {
        view.setUint8(offset + i, str.charCodeAt(i));
      }
    }
    writeString(0, 'RIFF');
    view.setUint32(4, 36 + samples.length * 2, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, 16000, true);
    view.setUint32(28, 32000, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, samples.length * 2, true);
    for (let i = 0; i < samples.length; i++) {
      view.setInt16(44 + i * 2, samples[i], true);
    }
    return buf;
  }
})();
</script>
</body>
</html>
